[package]
name = "adapter-jose-092"
version = "1.0.0"
edition = "2021"
publish = false
build = "../common/build_version.rs"

[package.metadata.adapter]
target_crate = "jsonwebtoken"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
# Library under test. `aws_lc_rs` is the primary crypto backend of the environment record
# (README example); the default `use_pem` feature stays on as in the record.
jsonwebtoken = { version = "=11.1.0", features = ["aws_lc_rs"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = false
