[package]
name = "adapter-sdjwt-025"
version = "1.0.0"
edition = "2021"
publish = false
build = "../common/build_version.rs"

[package.metadata.adapter]
target_crate = "ssi-sd-jwt"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
# Library under test. ssi-sd-jwt depends on ssi-jws/ssi-jwk with default-features = false,
# so no signature algorithm is compiled in by default. The environment record
# (_bilgi-SDJWT-025-ozellik) enables `secp256r1` and `ed25519` on both crates through
# feature unification; the same feature set is used here.
ssi-sd-jwt = "=0.6.0"
ssi-jws = { version = "=0.5.0", default-features = false, features = ["secp256r1", "ed25519"] }
ssi-jwk = { version = "=0.4.0", default-features = false, features = ["secp256r1", "ed25519"] }
# JWT layer that ssi-sd-jwt itself delegates to (same project, same locked versions); used for
# plain compact JWS inputs, which ssi-sd-jwt cannot decode because `_sd_alg` is mandatory there.
ssi-jwt = { version = "=0.6.0", default-features = false }
ssi-claims-core = "=0.2.0"
futures = { version = "0.3", default-features = false, features = ["executor"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = false
