[package]
name = "adapter-jose-091"
version = "1.0.0"
edition = "2021"
publish = false
build = "../common/build_version.rs"

# Read by the build script: the crate whose locked version is reported as `hedef_surum`.
[package.metadata.adapter]
target_crate = "frank_jwt"

[[bin]]
name = "adapter"
path = "src/main.rs"

[dependencies]
# Library under test (version fixed to the environment record).
frank_jwt = "=3.1.4"
# Same openssl crate that frank_jwt links against; used only to turn a public JWK into
# the PEM document that frank_jwt::decode expects. No signature is checked through it.
openssl = "=0.10.81"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = false
